name: Test mkdocs build

on:
  pull_request:

env:
  UV_LOCKED: true # Assert that the `uv.lock` will remain unchanged

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v8.2.0
        with:
          # It is considered best practice to pin to a specific uv version.
          version: "0.11.26"

      - name: Install site dependencies
        run: uv sync

      - name: Set up subprojects
        run: ./setup_subprojects.sh

      - name: Test mkdocs build with --strict
        run: DISABLE_MKDOCS_2_WARNING=true uv run --no-sync mkdocs build --strict

      # Publish the documentation artifact for review.
      - name: Upload built site
        id: upload-site
        uses: actions/upload-artifact@v7
        with:
          name: site-pr-${{ github.event.pull_request.number }}
          path: site/
          retention-days: 14

      # Renders on the workflow run page, just above the artifacts list.
      - name: Add preview instructions to the run summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Preview the built documentation

          1. Download [site-pr-${{ github.event.pull_request.number }}.zip][artifact]
          2. Unzip it and serve the HTML files.
             - For example: `unzip site-pr-X.zip -d out-dir && python3 -m http.server --directory out-dir 8000`
          3. Open <http://localhost:8000>

          [artifact]: ${{ steps.upload-site.outputs.artifact-url }}
          EOF

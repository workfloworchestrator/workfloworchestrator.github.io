name: gh-pages

# Deployment stays separate from the pull-request gate: it runs on pushes to main and on the
# `docs-update` dispatch from the sub-project repositories. PRs are checked by ci.yml instead.
on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [docs-update]

permissions:
  contents: write

env:
  UV_LOCKED: true # Assert that the `uv.lock` will remain unchanged

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"

      - name: Install site dependencies
        run: uv sync

      - name: Set up subprojects
        run: ./setup_subprojects.sh

      - name: Build and deploy
        run: uv run --no-sync mkdocs gh-deploy --force --strict

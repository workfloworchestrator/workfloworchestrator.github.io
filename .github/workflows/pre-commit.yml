name: pre-commit

# Reusable from ci.yml only. Keep the pull_request trigger out of this file so pre-commit is
# reported once, through the "CI result" gate, instead of as a separate check.
on:
  workflow_call:

env:
  UV_LOCKED: true # Assert that the `uv.lock` will remain unchanged

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"

      - name: Install dependencies
        run: uv sync

      - uses: pre-commit/action@v3.0.1
